<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="25" fill="#000000" />
  
  <!-- Vision Rings -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#gradCyan)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" filter="url(#glowCyan)"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#gradCyan)" stroke-width="4" stroke-dasharray="40 20" filter="url(#glowCyan)"/>
  
  <!-- Neural 'N' representing Nalla Sumang overlapping the pupil -->
  <path d="M 35 65 L 35 35 L 65 65 L 65 35" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowCyan)"/>
  
  <!-- Energy Nodes -->
  <circle cx="35" cy="35" r="5" fill="#22d3ee" filter="url(#glowCyan)"/>
  <circle cx="65" cy="65" r="5" fill="#c026d3" filter="url(#glowCyan)"/>
</svg>

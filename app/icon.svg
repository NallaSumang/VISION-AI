<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="#020202" />
  
  <!-- Outer Cyber Rings (Memory Loop) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#082f49" stroke-width="3" stroke-dasharray="15 5" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="#0c4a6e" stroke-width="1" />
  
  <!-- Sharp Dragon Eye Outline (Vision) -->
  <path d="M 12 50 Q 50 15 88 50 Q 50 85 12 50 Z" fill="none" stroke="url(#gradCyan)" stroke-width="4" filter="url(#glowCyan)" />
  <path d="M 20 50 Q 50 25 80 50 Q 50 75 20 50 Z" fill="none" stroke="#164e63" stroke-width="1" />
  
  <!-- Dragon Pupil (Diamond Slit) -->
  <polygon points="50,28 58,50 50,72 42,50" fill="url(#gradCyan)" filter="url(#glowCyan)"/>
  
  <!-- Core Highlight -->
  <polygon points="50,35 53,50 50,65 47,50" fill="#ffffff" filter="url(#glowCyan)"/>
</svg>
